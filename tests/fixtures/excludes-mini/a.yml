services:
  web:
    image: example/web:1.0
    environment:
      - DATABASE_URL=postgres://db/app
      - CACHE_URL=redis://cache/0
      - LOG_LEVEL=info
    ports:
      - "8080:80"
    depends_on:
      - db
      - cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: example/worker:1.0
    environment:
      - DATABASE_URL=postgres://db/app
      - QUEUE_URL=amqp://queue/jobs
      - CONCURRENCY=8
    depends_on:
      - db
      - queue
