[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-report"
version = "0.1.0"
description = "Measure duplication, dead code and cyclomatic complexity in CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
quality-report = "quality_report.cli:main"

[tool.setuptools]
packages = ["quality_report", "collector"]

[tool.setuptools.package-data]
collector = ["schema.sql"]

[tool.pytest.ini_options]
markers = [
    "tools: needs external analysis tools (jscpd, lizard, ...) installed",
    "db: needs a running Postgres",
]

[tool.ruff]
target-version = "py311"
