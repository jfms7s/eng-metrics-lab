[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-report"
version = "0.3.1"
description = "Measure duplication, dead code, cyclomatic and cognitive complexity, test coverage and test gaps in CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml", "psycopg[binary]>=3.2", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "responses", "vulture==2.16", "deptry==0.25.1"]

[project.scripts]
quality-report = "quality_report.cli:main"
quality-collector = "collector.main:main"

[tool.setuptools]
packages = ["quality_report", "collector"]

[tool.setuptools.package-data]
collector = ["schema.sql"]

[tool.pytest.ini_options]
markers = [
    "tools: needs external analysis tools (jscpd, lizard, ...) installed",
    "db: needs a running Postgres",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/fixtures"]
